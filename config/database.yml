default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV['DATABASE_USERNAME'] %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: <%= ENV['DATABASE_HOST'] %>
  port: 3306
  timeout: 5000

development:
  <<: *default
  database: internet_of_things

test:
  <<: *default
  database: iot_test

production:
  <<: *default
  database: internet_of_things
